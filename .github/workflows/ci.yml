name: network-agent-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Static release checks
        run: python scripts/release_check.py
      - name: Automated tests
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start local services
        run: docker compose up --build --detach simulator redis
      - name: Check simulator endpoints
        run: python scripts/stage6_smoke.py --base-url http://127.0.0.1:8000
      - name: Exercise bounded mock Agent and Redis from container
        run: docker compose run --rm -T agent --incident-id INC-0001 --mode mock --cache redis
      - name: Inspect container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans
